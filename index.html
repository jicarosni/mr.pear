<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating DVD Logo</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #dvd-logo {
            position: absolute;
            width: 80px;
            height: 40px;
            background-color: #e50914;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="dvd-logo">DVD</div>

    <script>
        const dvdLogo = document.getElementById('dvd-logo');

        // Initial position and speed
        let x = Math.random() * (window.innerWidth - dvdLogo.clientWidth);
        let y = Math.random() * (window.innerHeight - dvdLogo.clientHeight);
        let speedX = (Math.random() > 0.1 ? 1 : -1) * (2 + Math.random() * 2);
        let speedY = (Math.random() > 0.1 ? 1 : -1) * (2 + Math.random() * 2);

        function moveDVDLogo() {
            x += speedX;
            y += speedY;

            // Bounce off the horizontal walls
            if (x + dvdLogo.clientWidth > window.innerWidth || x < 0) {
                speedX = -speedX;
            }

            // Bounce off the vertical walls
            if (y + dvdLogo.clientHeight > window.innerHeight || y < 0) {
                speedY = -speedY;
            }

            // Update the position
            dvdLogo.style.left = `${x}px`;
            dvdLogo.style.top = `${y}px`;

            // Request the next animation frame
            requestAnimationFrame(moveDVDLogo);
        }

        // Start the animation
        moveDVDLogo();

        // Optional: Add a click event to stop the animation
        dvdLogo.addEventListener('click', () => {
            cancelAnimationFrame(moveDVDLogo);
        });
    </script>

</body>
</html>
