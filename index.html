<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid Game</title>

    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #282c34;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid #61dafb;
            overflow: hidden;
        }

        .ball, .paddle, .brick {
            position: absolute;
            background-color: #61dafb;
            width: 50px;
            height: 20px;
            border-radius: 5px;
        }

        .ball {
            width: 20px;
            height: 20px;
            background-color: #e50914;
        }

        .brick-row {
            display: flex;
            flex-wrap: wrap;
        }

        .brick {
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="ball"></div>
        <div class="paddle"></div>
        <div class="brick-row">
            <!-- Add multiple brick elements here -->
        </div>
    </div>

    <script>
        const ball = document.querySelector('.ball');
        const paddle = document.querySelector('.paddle');
        const bricks = document.querySelectorAll('.brick');
        const gameContainer = document.querySelector('.game-container');

        let ballX = 200;
        let ballY = 300;
        let ballSpeedX = 5;
        let ballSpeedY = 5;

        function update() {
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Ball bouncing off walls
            if (ballX > gameContainer.clientWidth - ball.clientWidth || ballX < 0) {
                ballSpeedX = -ballSpeedX;
            }
            if (ballY < 0) {
                ballSpeedY = -ballSpeedY;
            }

            // Ball hitting the paddle
            if (
                ballY + ball.clientHeight > paddle.offsetTop &&
                ballX + ball.clientWidth > paddle.offsetLeft &&
                ballX < paddle.offsetLeft + paddle.clientWidth
            ) {
                ballSpeedY = -ballSpeedY;
            }

            // Ball hitting the bricks
            bricks.forEach((brick) => {
                if (
                    ballY < brick.offsetTop + brick.clientHeight &&
                    ballY + ball.clientHeight > brick.offsetTop &&
                    ballX + ball.clientWidth > brick.offsetLeft &&
                    ballX < brick.offsetLeft + brick.clientWidth
                ) {
                    ballSpeedY = -ballSpeedY;
                    brick.style.display = 'none'; // Remove the brick
                }
            });

            // Game over if the ball goes below the paddle
            if (ballY > gameContainer.clientHeight) {
                alert('Game Over!');
                document.location.reload();
            }

            // Move the ball
            ball.style.left = ballX + 'px';
            ball.style.top = ballY + 'px';

            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft' && paddle.offsetLeft > 0) {
                paddle.style.left = paddle.offsetLeft - 10 + 'px';
            } else if (event.key === 'ArrowRight' && paddle.offsetLeft < gameContainer.clientWidth - paddle.clientWidth) {
                paddle.style.left = paddle.offsetLeft + 10 + 'px';
            }
        });

        update();
    </script>

</body>
</html>
